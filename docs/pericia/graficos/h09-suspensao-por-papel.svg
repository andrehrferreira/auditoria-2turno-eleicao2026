<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 426" width="760" height="426" role="img" aria-labelledby="titulo desc">
<title id="titulo">De quem é o número gravado quando o mesário suspende um eleitor</title><desc id="desc">Linhas da mensagem "Título ... é válido / inválido para suspender a votação", no dia de cada turno. 1º turno, "válido": 82.4 linhas; Mesário registrado na própria urna 69.91; Outro papel registrado (presidente que encerrou, servidor, mesário de outra urna ou turno) 569; Não é título (dígito verificador errado) 0; Título válido sem papel nenhum no país 11.92. 1º turno, "inválido": 55.96 linhas; Mesário registrado na própria urna 200; Outro papel registrado (presidente que encerrou, servidor, mesário de outra urna ou turno) 130; Não é título (dígito verificador errado) 12.07; Título válido sem papel nenhum no país 43.56. 2º turno, "válido": 8.5 linhas; Mesário registrado na própria urna 6.51; Outro papel registrado (presidente que encerrou, servidor, mesário de outra urna ou turno) 38; Não é título (dígito verificador errado) 0; Título válido sem papel nenhum no país 1.95. 2º turno, "inválido": 4.99 linhas; Mesário registrado na própria urna 10; Outro papel registrado (presidente que encerrou, servidor, mesário de outra urna ou turno) 5; Não é título (dígito verificador errado) 1.36; Título válido sem papel nenhum no país 3.61</desc>
