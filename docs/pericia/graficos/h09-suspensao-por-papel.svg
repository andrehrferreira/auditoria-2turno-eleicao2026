<rect class="s2" x="20" y="110" width="12" height="12" rx="2"/><text class="t1" x="38" y="121" font-size="13">Não é título (dígito verificador errado)</text>
<rect class="s1" x="338" y="110" width="12" height="12" rx="2"/><text class="t1" x="356" y="121" font-size="13">Título válido sem papel nenhum no país</text>
