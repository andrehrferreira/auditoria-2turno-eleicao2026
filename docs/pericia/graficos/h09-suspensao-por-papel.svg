<rect class="fundo" width="760" height="426" rx="6"/>
<text class="t1" x="20" y="30" font-size="17" font-weight="600">De quem é o número gravado quando o mesário suspende um eleitor</text>
<text class="t2" x="20" y="52" font-size="13">Linhas da mensagem "Título ... é válido / inválido para suspender a votação", no dia de cada turno.</text>
<rect class="s0" x="20" y="70" width="12" height="12" rx="2"/><text class="t1" x="38" y="81" font-size="13">Mesário registrado na própria urna</text>
