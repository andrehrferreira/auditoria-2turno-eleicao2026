<text class="tb" x="207.27" y="319.5" font-size="12" text-anchor="middle">27%</text>
<rect class="s1" x="263.3" y="300" width="296.7" height="30"/>
<text class="tb" x="411.65" y="319.5" font-size="12" text-anchor="middle">72%</text>
<text class="t1" x="568" y="312" font-size="12.5" font-weight="600">3.61 sem papel</text>
<text class="t2" x="568" y="327" font-size="12">de 4.99 linhas</text>
<text class="t2" x="355" y="370" font-size="12.5" text-anchor="middle">Parte das linhas da mensagem, por quem é o número (%)</text>
<text class="t2" x="20" y="396" font-size="12">Laranja: número com formato válido de título que não é de nenhum mesário, presidente ou servidor registrado no país.</text>
<text class="t2" x="20" y="414" font-size="11">Fonte: RDV e diário (log) de todas as urnas, dois turnos; números conferidos por segunda verificação independente.</text>
</svg>
