<text class="t2" x="20" y="52" font-size="13">Votos nas seções com urna 2013 ou 2015 (Brasil e exterior) comparados com a margem nacional.</text>
<line class="grade" x1="210" x2="210" y1="78" y2="252" stroke-width="1"/>
