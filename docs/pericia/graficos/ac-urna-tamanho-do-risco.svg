<text class="t2" x="524.2857142857142" y="268" font-size="12" text-anchor="middle">10 mi</text>
<line class="grade" x1="587.1428571428571" x2="587.1428571428571" y1="78" y2="252" stroke-width="1"/>
<text class="t2" x="587.1428571428571" y="268" font-size="12" text-anchor="middle">12 mi</text>
