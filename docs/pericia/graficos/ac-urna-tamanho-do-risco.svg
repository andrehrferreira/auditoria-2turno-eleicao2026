<text class="t1" x="285.6173028571429" y="239.5" font-size="12.5">2.215.096</text>
<text class="t2" x="430" y="288" font-size="12.5" text-anchor="middle">Votos (mi = milhões)</text>
<text class="t2" x="20" y="320" font-size="12">Mede o tamanho do que estaria em jogo, não é sinal de fraude. Trocar 1 voto do 13 para o 22 diminui a margem em 2.</text>
<text class="t2" x="20" y="336" font-size="11">Fonte: arquivos oficiais do TSE, todas as seções.</text>
