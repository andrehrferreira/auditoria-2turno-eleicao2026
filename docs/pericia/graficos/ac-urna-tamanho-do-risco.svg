<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 348" width="760" height="348" role="img" aria-labelledby="titulo desc">
<title id="titulo">O tamanho do risco nas urnas da AC URNA (Presidente, 2º turno)</title><desc id="desc">Votos nas seções com urna 2013 ou 2015 (Brasil e exterior) comparados com a margem nacional. Votos do 13 nas urnas da AC URNA: 13.140.473; Votos do 22 nas urnas da AC URNA: 12.026.599; Margem nacional do 13 sobre o 22: 4.430.191; Mínimo de votos trocados nessas urnas para virar: 2.215.096.</desc>
<style>
