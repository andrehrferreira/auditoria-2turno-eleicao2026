<text class="t1" x="628.9862942857143" y="101.5" font-size="12.5">13.140.473</text>
<text class="t1" x="200" y="140.5" font-size="13" text-anchor="end">Votos do 22 nas urnas</text>
<text class="t1" x="200" y="155.5" font-size="13" text-anchor="end">da AC URNA</text>
