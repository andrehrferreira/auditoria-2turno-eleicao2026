<text class="t1" x="355.2345742857143" y="193.5" font-size="12.5">4.430.191</text>
<text class="t1" x="200" y="232.5" font-size="13" text-anchor="end">Mínimo de votos trocados</text>
<text class="t1" x="200" y="247.5" font-size="13" text-anchor="end">nessas urnas para virar</text>
