<text class="t2" x="272.85714285714283" y="268" font-size="12" text-anchor="middle">2 mi</text>
<line class="grade" x1="335.7142857142857" x2="335.7142857142857" y1="78" y2="252" stroke-width="1"/>
<text class="t2" x="335.7142857142857" y="268" font-size="12" text-anchor="middle">4 mi</text>
<line class="grade" x1="398.57142857142856" x2="398.57142857142856" y1="78" y2="252" stroke-width="1"/>
<text class="t2" x="398.57142857142856" y="268" font-size="12" text-anchor="middle">6 mi</text>
<line class="grade" x1="461.42857142857144" x2="461.42857142857144" y1="78" y2="252" stroke-width="1"/>
<text class="t2" x="461.42857142857144" y="268" font-size="12" text-anchor="middle">8 mi</text>
