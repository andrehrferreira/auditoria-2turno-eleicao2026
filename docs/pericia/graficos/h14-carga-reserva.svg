<title id="titulo">Para onde a reserva foi carregada: troca nova × reserva herdada</title><desc id="desc">Parte das reservas cuja carga gravou município ou zona diferentes dos da seção onde votaram. Carga gravada para outro município: Troca nova por reserva 18,59% (524 de 2.818); Reserva herdada do 1º turno 18,01% (521 de 2.893). Carga gravada para outra zona eleitoral: Troca nova por reserva 4,44% (125 de 2.818); Reserva herdada do 1º turno 1,56% (45 de 2.893)</desc>
