<text class="t2" x="470" y="426" font-size="12" text-anchor="middle">75%</text>
<line class="grade" x1="550" x2="550" y1="94" y2="410" stroke-width="1"/>
<text class="t2" x="550" y="426" font-size="12" text-anchor="middle">100%</text>
