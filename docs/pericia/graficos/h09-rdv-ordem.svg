<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 498" width="760" height="498" role="img" aria-labelledby="titulo desc">
<title id="titulo">Listas de votos do RDV em ordem de tipo e número, por origem</title><desc id="desc">Parte das listas (uma por cargo e seção) ordenadas. Todas as geradas por urna estão ordenadas. Urna da seção: 1º turno 100% (2.48.472 de 2.48.472); 2º turno 100% (533.66 de 533.66). Urna reserva: 1º turno 100% (15.04 de 15.04); 2º turno 100% (6.11 de 6.11). Recuperador de Dados (RED): 1º turno 100% (250 de 250); 2º turno 100% (19 de 19). Apuração em papel no exterior (cédulas): 1º turno 100% (29 de 29); 2º turno 100% (29 de 29). Apuração mista em MG: cédulas digitadas: 1º turno 10% (1 de 10); 2º turno não houve. Apuração mista em MG: cópia do boletim: 1º turno 60% (6 de 10); 2º turno não houve</desc>
<style>
  .fundo{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.tb{fill:#ffffff}.grade{stroke:#e4e3df}.eixo{stroke:#9a9993}
  .s0{fill:#2a78d6}.s1{fill:#eb6834}.s2{fill:#9a9993}.s3{fill:#8fb8ea}
  text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
  @media (prefers-color-scheme:dark){.fundo{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.tb{fill:#ffffff}.grade{stroke:#383835}.eixo{stroke:#6d6c66}.s0{fill:#3987e5}.s1{fill:#d95926}.s2{fill:#8a8984}.s3{fill:#5f8fc9}}
</style>
