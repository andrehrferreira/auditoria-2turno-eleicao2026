<text class="t2" x="310" y="426" font-size="12" text-anchor="middle">25%</text>
<line class="grade" x1="390" x2="390" y1="94" y2="410" stroke-width="1"/>
<text class="t2" x="390" y="426" font-size="12" text-anchor="middle">50%</text>
