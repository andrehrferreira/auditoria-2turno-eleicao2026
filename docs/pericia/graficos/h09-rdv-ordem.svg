<text class="t2" x="236" y="402.5" font-size="12">2º turno: não houve</text>
<text class="t2" x="390" y="446" font-size="12.5" text-anchor="middle">Listas ordenadas por tipo de voto e número digitado (%)</text>
<text class="t2" x="20" y="468" font-size="12">Lista ordenada não guarda a ordem em que os eleitores votaram. As de MG seguem a ordem em que as cédulas foram digitadas.</text>
<text class="t2" x="20" y="486" font-size="11">Fonte: RDV e diário (log) de todas as urnas, dois turnos; números conferidos por segunda verificação independente.</text>
