<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="titulo desc">
<title id="titulo">O que aconteceu depois de cada erro anotado na autoverificação</title><desc id="desc">Anotações de "ERRO" na conferência do próprio programa, ao ligar a urna. Nenhuma urna votou na mesma inicialização. Programa instalado de novo
(nova carga) na mesma urna: 2º turno (181 anotações) 36; 1º turno (146 anotações) 36. Urna trocada por reserva: 2º turno (181 anotações) 17; 1º turno (146 anotações) 11. Mesma urna religada,
sem nova carga: 2º turno (181 anotações) 128; 1º turno (146 anotações) 99</desc>
