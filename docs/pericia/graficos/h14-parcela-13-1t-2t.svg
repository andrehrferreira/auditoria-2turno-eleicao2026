<title id="titulo">Parcela do 13 entre os votos do 13 e do 22, no 1º e no 2º turno</title><desc id="desc">Mesmas seções nos dois turnos. Nos três grupos o 13 sobe quase o mesmo tanto: entre 2,77 e 2,84 pontos. Seções sem troca (491.843 seções): 48,99% no 1º turno, 51,78% no 2º, variação de 2,80 pontos. Troca nova por reserva (2.818 seções): 48,73% no 1º turno, 51,50% no 2º, variação de 2,77 pontos. Reserva herdada do 1º turno (2.893 seções): 49,02% no 1º turno, 51,85% no 2º, variação de 2,84 pontos</desc>
