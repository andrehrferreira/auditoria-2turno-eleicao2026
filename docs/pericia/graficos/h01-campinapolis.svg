<title id="titulo">Campinápolis (MT): eleitores de 100 anos ou mais e quantos votaram, ao lado do Censo</title><desc id="desc">32 dos 224 títulos votaram no 1º turno de 2026. O Censo 2022 permite no máximo 79 pessoas dessa geração. Indígenas Xavante: 30 aptos, 20 votaram. Raça/cor não informada: 192 aptos, 12 votaram. Outra raça/cor: 2 aptos, 0 votaram. Total: 224 aptos, 32 votaram. Censo 2022: 75 pessoas com 96 anos ou mais e 4 com 95, teto de 79</desc>
