<text class="t1" x="266.15999999999997" y="319.5" font-size="12">32</text>
<text class="t1" x="190" y="345.5" font-size="13" text-anchor="end">Censo 2022, 95 anos ou mais</text>
<path class="s2" d="M200,334h144.51999999999998a4,4 0 0 1 4,4v6a4,4 0 0 1 -4,4h-144.51999999999998z"><title>Censo 2022, 95 anos ou mais: 79 pessoas: 75 com 96 anos ou mais + 4 com 95</title></path>
<text class="t1" x="354.52" y="345.5" font-size="12">79 (75 com 96 anos ou mais + 4 com 95), sem descontar mortes</text>
<text class="t2" x="435" y="388" font-size="12.5" text-anchor="middle">Títulos de eleitor ou pessoas, na mesma escala</text>
<text class="t2" x="20" y="414" font-size="12">O número ao lado de cada barra dá o valor. Nenhum dos 192 títulos sem raça/cor informada tem digital cadastrada.</text>
<text class="t2" x="20" y="432" font-size="12">Como ler: a barra azul conta os títulos de 100 anos ou mais no cadastro; a laranja, quantos deles votaram no 1º turno.</text>
<text class="t2" x="20" y="450" font-size="12">A barra verde soma quem o Censo 2022 contou com 95 anos ou mais, a geração que pode ter 100 anos ou mais em 2026,</text>
<text class="t2" x="20" y="468" font-size="12">sem descontar quem morreu desde então: é um teto. Mesmo esse teto, 79, fica abaixo dos 224 títulos.</text>
<text class="t2" x="20" y="486" font-size="11">Fonte: TSE, comparecimento por idade e raça/cor (1º turno de 2026) e perfil do eleitorado por seção (julho de 2026); IBGE, Censo 2022.</text>
