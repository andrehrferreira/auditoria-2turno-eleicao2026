<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 492" width="760" height="492" role="img" aria-labelledby="titulo desc">
<title id="titulo">O certificado público da AC URNA venceu antes da eleição de 2026</title><desc id="desc">Período de validade do certificado público de cada autoridade do TSE para urnas (barras) e datas da eleição (linhas). AC URNA: 22/07/2011 a 18/07/2026; AC UE2020: 05/07/2021 a 01/07/2037; AC UE2022: 28/02/2023 a 24/02/2039. Carteiras das urnas em uso vencem de 08/04/2027 a 15/01/2038. 1º turno 04/10/2026, 2º turno 25/10/2026.</desc>
<style>
  .fundo{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.tb{fill:#ffffff}.grade{stroke:#e4e3df}.eixo{stroke:#9a9993}
  .s0{fill:#2a78d6}.s1{fill:#eb6834}.s2{fill:#d6d5d0}.marco{stroke:#0b0b0b}.vence{stroke:#eb6834}
  text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
  @media (prefers-color-scheme:dark){.fundo{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.grade{stroke:#383835}.eixo{stroke:#6d6c66}.s0{fill:#3987e5}.s1{fill:#d95926}.s2{fill:#4a4a46}.marco{stroke:#f0efec}.vence{stroke:#d95926}}
</style>
<rect class="fundo" width="760" height="492" rx="6"/>
