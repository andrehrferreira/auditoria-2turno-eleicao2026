<title id="titulo">Eleitores aptos de 95 a 99 e de 100 anos ou mais, e quantos votaram, 1º turno</title><desc id="desc">Os títulos dessas idades se multiplicaram; os votantes ficaram abaixo de 15 mil por faixa em todo ano. Faixa de 95 a 99 anos: 2014, 72.726 aptos e 4.682 votaram; 2018, 272.334 aptos e 5.082 votaram; 2022, 466.703 aptos e 7.591 votaram; 2026, 337.136 aptos e 14.661 votaram. Faixa de 100 anos ou mais: 2014, 21.271 aptos e 2.528 votaram; 2018, 39.026 aptos e 1.506 votaram; 2022, 184.330 aptos e 1.675 votaram; 2026, 297.977 aptos e 2.141 votaram</desc>
