<text class="t1" x="20" y="30" font-size="17" font-weight="600">Eleitores aptos de 95 a 99 e de 100 anos ou mais, e quantos votaram, 1º turno</text>
<text class="t2" x="20" y="52" font-size="13">Os títulos dessas idades se multiplicaram; os votantes ficaram abaixo de 15 mil por faixa em todo ano.</text>
