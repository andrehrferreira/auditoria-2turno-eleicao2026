<text class="t2" x="706" y="294.5" font-size="12" text-anchor="middle" transform="rotate(90 706 294.5)">a mesma geração, 4 anos depois</text>
<text class="t2" x="395" y="522" font-size="12.5" text-anchor="middle">Eleitores (títulos aptos e votantes, na mesma escala)</text>
<text class="t2" x="20" y="548" font-size="12">Os votantes são tão poucos perto dos aptos que a barra laranja quase não aparece; o número ao lado dá o valor.</text>
<text class="t2" x="20" y="566" font-size="12">Como ler: a barra azul conta os títulos da faixa no cadastro; a laranja, quantos deles foram votar.</text>
<text class="t2" x="20" y="584" font-size="12">A seta segue a mesma geração: em 2018 ela enche a faixa de 95 a 99 anos e, em 2022, chega à de 100 ou mais,</text>
<text class="t2" x="20" y="602" font-size="12">que ganha 145.304 títulos e só 169 votantes. O estoque de títulos cresceu; os votos, quase não.</text>
<text class="t2" x="20" y="620" font-size="11">Fonte: perfil de comparecimento e abstenção do TSE, 1º turno de 2014, 2018, 2022 e 2026, Brasil sem o exterior.</text>
</svg>
