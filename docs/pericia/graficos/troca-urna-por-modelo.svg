<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 278" width="760" height="278" role="img" aria-labelledby="titulo desc">
<title id="titulo">Urnas trocadas por reserva entre o 1º e o 2º turno, por modelo</title><desc id="desc">Seções em que a urna do 2º turno é uma reserva diferente da urna do 1º turno, a cada mil seções do modelo. Urna 2013: Por mil seções 34,90. Urna 2015: Por mil seções 10,16. Urna 2020: Por mil seções 4,84. Urna 2022: Por mil seções 2,71</desc>
<style>
  .fundo{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grade{stroke:#e4e3df}.eixo{stroke:#9a9993}
  .s0{fill:#2a78d6}.s1{fill:#eb6834}
  text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
  @media (prefers-color-scheme:dark){.fundo{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.grade{stroke:#383835}.eixo{stroke:#6d6c66}.s0{fill:#3987e5}.s1{fill:#d95926}}
</style>
<rect class="fundo" width="760" height="278" rx="6"/>
<text class="t1" x="20" y="30" font-size="17" font-weight="600">Urnas trocadas por reserva entre o 1º e o 2º turno, por modelo</text>
<text class="t2" x="20" y="52" font-size="13">Seções em que a urna do 2º turno é uma reserva diferente da urna do 1º turno, a cada mil seções do modelo.</text>
<line class="grade" x1="250" x2="250" y1="72" y2="208" stroke-width="1"/>
<text class="t2" x="250" y="224" font-size="12" text-anchor="middle">0</text>
<line class="grade" x1="340" x2="340" y1="72" y2="208" stroke-width="1"/>
<text class="t2" x="340" y="224" font-size="12" text-anchor="middle">10</text>
<line class="grade" x1="430" x2="430" y1="72" y2="208" stroke-width="1"/>
<text class="t2" x="430" y="224" font-size="12" text-anchor="middle">20</text>
<line class="grade" x1="520" x2="520" y1="72" y2="208" stroke-width="1"/>
<text class="t2" x="520" y="224" font-size="12" text-anchor="middle">30</text>
<line class="grade" x1="610" x2="610" y1="72" y2="208" stroke-width="1"/>
<text class="t2" x="610" y="224" font-size="12" text-anchor="middle">40</text>
<line class="eixo" x1="250" x2="250" y1="72" y2="208" stroke-width="1"/>
<text class="t1" x="240" y="92" font-size="13" text-anchor="end">Urna 2013</text>
<path class="s0" d="M250,78h310.1a4,4 0 0 1 4,4v10a4,4 0 0 1 -4,4h-310.1z"/>
<text class="t1" x="570.1" y="91.5" font-size="12.5">34,9 por mil (416 de 11.921)</text>
<text class="t1" x="240" y="128" font-size="13" text-anchor="end">Urna 2015</text>
<path class="s0" d="M250,114h87.44a4,4 0 0 1 4,4v10a4,4 0 0 1 -4,4h-87.44z"/>
<text class="t1" x="347.44" y="127.5" font-size="12.5">10,2 por mil (894 de 88.035)</text>
<text class="t1" x="240" y="164" font-size="13" text-anchor="end">Urna 2020</text>
<path class="s0" d="M250,150h39.56a4,4 0 0 1 4,4v10a4,4 0 0 1 -4,4h-39.56z"/>
<text class="t1" x="299.56" y="163.5" font-size="12.5">4,8 por mil (970 de 200.463)</text>
<text class="t1" x="240" y="200" font-size="13" text-anchor="end">Urna 2022</text>
<path class="s0" d="M250,186h20.389999999999986a4,4 0 0 1 4,4v10a4,4 0 0 1 -4,4h-20.389999999999986z"/>
<text class="t1" x="280.39" y="199.5" font-size="12.5">2,7 por mil (538 de 198.757)</text>
<text class="t2" x="430" y="244" font-size="12.5" text-anchor="middle">Trocas por mil seções</text>
<text class="t2" x="20" y="266" font-size="11">Fonte: arquivos oficiais do TSE, todas as seções; números conferidos por segunda verificação independente.</text>
