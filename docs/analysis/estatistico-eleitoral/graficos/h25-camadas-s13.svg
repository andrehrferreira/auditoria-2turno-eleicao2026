<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 463" width="900" height="463" role="img" aria-labelledby="titulo desc">
<title id="titulo">Urnas da AC URNA vencida votam diferente das urnas novas do mesmo lugar?</title><desc id="desc">Diferença A − B na parcela do 13. Sem controle: +0,53 p.p. no 2º turno. Mesmo local + perfil: +0,65 p.p. no 2º turno, +0,79 no 1º, variação −0,11.</desc>
<style>
