<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 539" width="860" height="539" role="img" aria-labelledby="titulo desc">
<title id="titulo">H17: o atendimento seguinte a um voto termina em "já votou"?</title><desc id="desc">Taxa de "já votou" no atendimento seguinte: biometria 0,51 (2º) e 0,52 (1º) por mil; ano de nascimento 0,59 (2º) e 0,64 (1º) por mil; manual, mesário gravado 0,54 (2º) e 0,71 (1º) por mil; manual, sem mesário gravado 0,65 (2º) e 0,89 (1º) por mil.</desc>
<style>
  .fundo{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grade{stroke:#e4e3df}.eixo{stroke:#9a9993}
  .l0{stroke:#2a78d6}.l1{stroke:#eb6834}.l2{stroke:#1baf7a}.p0{fill:#2a78d6}.p1{fill:#eb6834}.p2{fill:#1baf7a}.p1c{fill:#eb6834;fill-opacity:.45}.p0c{fill:#2a78d6;fill-opacity:.45}
  text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
  @media (prefers-color-scheme:dark){.fundo{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.grade{stroke:#383835}.eixo{stroke:#6d6c66}
    .l0{stroke:#3987e5}.l1{stroke:#d95926}.l2{stroke:#199e70}.p0{fill:#3987e5}.p1{fill:#d95926}.p2{fill:#199e70}.p1c{fill:#d95926;fill-opacity:.45}.p0c{fill:#3987e5;fill-opacity:.45}}
</style>
<rect class="fundo" width="860" height="539" rx="6"/>
<text class="t1" x="20" y="30" font-size="17" font-weight="600">H17: o atendimento seguinte a um voto termina em "já votou"?</text>
<text class="t2" x="20" y="52" font-size="13">Para cada voto, o próximo eleitor atendido em até 10 minutos recebe "o eleitor identificado já votou" (fora das consultas em série).</text>
<text class="t2" x="20" y="70" font-size="13">Taxa por mil votos, conforme a forma como o voto anterior foi liberado.</text>
<rect class="p0" x="20" y="91" width="22" height="11"/>
<text class="t1" x="56" y="102" font-size="12.5">2º turno</text>
<rect class="p1c" x="440" y="91" width="22" height="11"/>
<text class="t1" x="476" y="102" font-size="12.5">1º turno, mesmas urnas</text>
<line class="grade" x1="78" x2="836" y1="418" y2="418" stroke-width="1"/>
<text class="t2" x="70" y="422" font-size="12" text-anchor="end">0,0</text>
<line class="grade" x1="78" x2="836" y1="324.7" y2="324.7" stroke-width="1"/>
<text class="t2" x="70" y="328.7" font-size="12" text-anchor="end">0,5</text>
<line class="grade" x1="78" x2="836" y1="231.3" y2="231.3" stroke-width="1"/>
<text class="t2" x="70" y="235.3" font-size="12" text-anchor="end">1,0</text>
<line class="grade" x1="78" x2="836" y1="138" y2="138" stroke-width="1"/>
<text class="t2" x="70" y="142" font-size="12" text-anchor="end">1,5</text>
<line class="eixo" x1="78" x2="836" y1="418" y2="418" stroke-width="1"/>
<text class="t2" x="18" y="278" font-size="12.5" text-anchor="middle" transform="rotate(-90 18 278)">Eventos por mil votos</text>
<rect class="p0" x="126.8" y="322.5" width="42.0" height="95.5"><title>2º turno, biometria: 57.288 em 111.957.315 votos</title></rect>
<text class="t1" x="147.8" y="317.5" font-size="11.5" text-anchor="middle">0,51</text>
<rect class="p1c" x="172.8" y="321.8" width="42.0" height="96.2"><title>1º turno, biometria: 56.289 em 109.279.923 votos</title></rect>
<text class="t1" x="193.8" y="316.8" font-size="11.5" text-anchor="middle">0,52</text>
<text class="t2" x="172.8" y="436" font-size="12.5" text-anchor="middle">biometria</text>
<rect class="p0" x="316.3" y="308.2" width="42.0" height="109.8"><title>2º turno, ano de nascimento: 4.267 em 7.251.791 votos</title></rect>
<text class="t1" x="337.3" y="303.2" font-size="11.5" text-anchor="middle">0,59</text>
<rect class="p1c" x="362.3" y="299.0" width="42.0" height="119.0"><title>1º turno, ano de nascimento: 4.411 em 6.919.518 votos</title></rect>
<text class="t1" x="383.3" y="294.0" font-size="11.5" text-anchor="middle">0,64</text>
<text class="t2" x="362.3" y="436" font-size="12.5" text-anchor="middle">ano de nascimento</text>
<rect class="p0" x="505.8" y="317.7" width="42.0" height="100.3"><title>2º turno, manual, mesário gravado: 3.137 em 5.840.975 votos</title></rect>
<text class="t1" x="526.8" y="312.7" font-size="11.5" text-anchor="middle">0,54</text>
<rect class="p1c" x="551.8" y="285.0" width="42.0" height="133.0"><title>1º turno, manual, mesário gravado: 3.635 em 5.101.996 votos</title></rect>
<text class="t1" x="572.8" y="280.0" font-size="11.5" text-anchor="middle">0,71</text>
<text class="t2" x="551.8" y="436" font-size="12.5" text-anchor="middle">manual, mesário gravado</text>
<rect class="p0" x="695.3" y="296.9" width="42.0" height="121.1"><title>2º turno, manual, sem mesário gravado: 1.811 em 2.791.328 votos</title></rect>
<text class="t1" x="716.3" y="291.9" font-size="11.5" text-anchor="middle">0,65</text>
<rect class="p1c" x="741.3" y="252.4" width="42.0" height="165.6"><title>1º turno, manual, sem mesário gravado: 2.847 em 3.209.943 votos</title></rect>
<text class="t1" x="762.3" y="247.4" font-size="11.5" text-anchor="middle">0,89</text>
<text class="t2" x="741.3" y="436" font-size="12.5" text-anchor="middle">manual, sem mesário gravado</text>
<text class="t2" x="20" y="472" font-size="12">Se votos sem digital fossem dados no lugar de eleitores presentes, o dono do título chegaria depois e ouviria "já votou":</text>
<text class="t2" x="20" y="489" font-size="12">a barra das liberações sem digital ficaria acima da barra da biometria. A comparação formal é por seção (Mantel-Haenszel).</text>
<text class="t2" x="20" y="506" font-size="12">Dados: data/parsed/auditoria/h15-h17/ja-votou.csv.</text>
<text class="t2" x="20" y="527" font-size="11">Fonte: logs de urna publicados pelo TSE (pacotes do 2º turno, com o dia do 1º turno no mesmo log); script estatistico-h15-h17-analise.mjs.</text>
</svg>
