<text class="t1" x="20" y="30" font-size="17" font-weight="600">Há urnas AC URNA isoladas fora da curva?</text>
<text class="t2" x="20" y="52" font-size="13">Distância de cada seção à sua zona eleitoral na parcela do 13 (perfil da seção descontado), em desvios típicos.</text>
<text class="t2" x="20" y="70" font-size="13">Escala vertical logarítmica, para mostrar as pontas. Só zonas com urnas dos dois tipos.</text>
