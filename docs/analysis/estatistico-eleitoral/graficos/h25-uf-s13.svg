<text class="t1" x="20" y="30" font-size="17" font-weight="600">Por UF: a parcela do 13 nas urnas AC URNA mudou do 1º para o 2º turno de um jeito diferente?</text>
<text class="t2" x="20" y="52" font-size="13">Ponto azul: diferença A − B na variação da parcela do 13 entre os turnos, na mesma seção e com a mesma urna, dentro da UF,</text>
<text class="t2" x="20" y="70" font-size="13">com perfil da seção e voto do 1º turno como controle. Círculo vazio: diferença no nível do 2º turno, dentro da mesma zona.</text>
