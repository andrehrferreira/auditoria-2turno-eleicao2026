<text class="t2" x="20" y="736" font-size="12">Como ler: um software que puxasse voto entre os turnos deslocaria os pontos azuis para o mesmo lado em muitas UFs. Pontos dos dois lados</text>
<text class="t2" x="20" y="753" font-size="12">do zero, com intervalos que cruzam o zero, são o que se espera do acaso. "Poucos municípios": o intervalo não é confiável (menos de 20 municípios).</text>
<text class="t2" x="20" y="770" font-size="12">Dados: data/parsed/auditoria/h25/grafico-uf-s13.csv e efeito-uf.csv.</text>
<text class="t2" x="20" y="795" font-size="11">Fonte: BU do 1º e do 2º turno (presidente) e pacotes .vsc do 2º turno publicados pelo TSE; scripts estatistico-h25-dados.mjs e estatistico-h25.mjs.</text>
